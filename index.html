<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天机阁 (Fairy Oracle Sanctuary) 简章</title>
    <style>
        body {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
            font-family: sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #1a1a1a; color: #eee; }
            a { color: #6db3f2; }
        }
        .lang-switch {
            position: absolute;
            top: 10px;
            right: 20px;
        }
        .lang-switch select {
            font-size: 0.9em;
            padding: 2px 6px;
        }
    </style>
</head>
<body>
    <div class="lang-switch">
        <select id="lang-select" onchange="switchLang(this.value)">
            <option value="en" selected>English</option>
            <option value="zh">中文</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
            <option value="pt">Português</option>
            <option value="de">Deutsch</option>
            <option value="hi">हिन्दी</option>
            <option value="tl">Tagalog</option>
            <option value="vi">Tiếng Việt</option>
            <option value="ru">Русский</option>
        </select>
    </div>
    <article>
        <header>
            <h1 data-i18n="title"></h1>
        </header>

        <section>
            <h2 data-i18n="s1_title"></h2>
            <p data-i18n="s1_p1"></p>
            <p data-i18n="s1_p2"></p>
        </section>

        <section>
            <h2 data-i18n="s2_title"></h2>
            <ul>
                <li data-i18n="s2_l1"></li>
                <li data-i18n="s2_l2"></li>
                <li data-i18n="s2_l3"></li>
                <li data-i18n="s2_l4"></li>
            </ul>
        </section>

        <section>
            <h2 data-i18n="s3_title"></h2>
            <ul>
                <li data-i18n="s3_l1"></li>
                <li data-i18n="s3_l2"></li>
                <li data-i18n="s3_l3"></li>
            </ul>
        </section>

        <section>
            <h2 data-i18n="s4_title"></h2>
            <ol>
                <li data-i18n="s4_l1"></li>
                <li data-i18n="s4_l2"></li>
                <li data-i18n="s4_l3"></li>
                <li data-i18n="s4_l4"></li>
                <li data-i18n="s4_l5"></li>
            </ol>
        </section>

        <section>
            <h2 data-i18n="s5_title"></h2>
            <ul>
                <li data-i18n="s5_l1"></li>
                <li data-i18n="s5_l2"></li>
                <li data-i18n="s5_l3"></li>
                <li data-i18n="s5_l4"></li>
                <li data-i18n="s5_l5"></li>
                <li data-i18n="s5_l6"></li>
            </ul>
        </section>

        <section>
            <h2 data-i18n="s6_title"></h2>
            <div class="role">
                <h3 data-i18n="s6_r1_title"></h3>
                <p data-i18n="s6_r1_desc"></p>
            </div>
            <div class="role">
                <h3 data-i18n="s6_r2_title"></h3>
                <p data-i18n="s6_r2_desc"></p>
            </div>
            <div class="role">
                <h3 data-i18n="s6_r3_title"></h3>
                <ul>
                    <li data-i18n="s6_r3_l1"></li>
                    <li data-i18n="s6_r3_l2"></li>
                </ul>
            </div>
            <div class="role">
                <h3 data-i18n="s6_r4_title"></h3>
                <p data-i18n="s6_r4_desc"></p>
            </div>
        </section>

        <section>
            <h2 data-i18n="s7_title"></h2>
            <p data-i18n="s7_strict"></p>
            <ul>
                <li data-i18n="s7_l1"></li>
                <li data-i18n="s7_l2"></li>
                <li data-i18n="s7_l3"></li>
            </ul>
        </section>

        <section>
            <h2 data-i18n="s8_title"></h2>
            <p data-i18n="s8_p1"></p>
            <ul>
                <li data-i18n="s8_l1"></li>
                <li data-i18n="s8_l2"></li>
                <li data-i18n="s8_l3"></li>
            </ul>
        </section>

        <section>
            <h2 data-i18n="s9_title"></h2>
            <p data-i18n="s9_p1"></p>
        </section>

        <footer>
            <p>🄯 2026 Fairy Oracle Sanctuary | <a href="https://github.com/Fairy-Oracle-Sanctuary/fos-docs">GitHub</a></p>
        </footer>
    </article>

<script src="i18n.js"></script>
</body>
</html>
